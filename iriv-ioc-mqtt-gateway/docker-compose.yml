# Mosquitto MQTT broker for IRIV IOC → MQTT and the web/ dashboard (WS :9001).
# From this folder: docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iriv-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
